name: Quality gates and NAS deployment

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Forgejo 12 has no concurrency groups. An independent deployment container
# completes an upgrade even when Forgejo cancels the job that started it.

jobs:
  quality:
    name: Lint, typecheck, test and build
    # This runner has host Docker access. Fork code needs an isolated runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, docker]
    container:
      image: node:24-bookworm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Activate the project package manager
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "$(cat .nvmrc)"
          corepack enable
          corepack install

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run repository quality gates
        run: pnpm check:ci

  deploy:
    name: Build, verify and deploy on NAS
    needs: quality
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, docker]
    container:
      image: node:24-bookworm
    timeout-minutes: 40
    env:
      DOCKER_API_VERSION: '1.43'
      # The NAS runs Engine 24. Its native builder needs no buildx installation.
      DOCKER_BUILDKIT: '0'
      REYUNPLEX_REVISION: ${{ github.sha }}
      REYUNPLEX_IMAGE: reyunplex:${{ github.sha }}
      NAS_APP_ROOT: ${{ vars.NAS_APP_ROOT }}
      NAS_MUSIC_DIR: ${{ vars.NAS_MUSIC_DIR }}
      NAS_PORT: ${{ vars.NAS_PORT || '3210' }}
      NAS_BIND_ADDRESS: ${{ vars.NAS_BIND_ADDRESS || '0.0.0.0' }}
      NAS_UID: ${{ vars.NAS_UID }}
      NAS_GID: ${{ vars.NAS_GID }}
    steps:
      - name: Check out the verified commit
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse Docker CLI and Compose from NAS image
        run: sh scripts/ci/install-docker.sh

      - name: Validate deployment settings and Compose
        run: |
          NAS_MUSIC_DIR=$(node --input-type=module -e "import {deploymentConfig} from './scripts/deploy/nas-deploy.mjs'; process.stdout.write(deploymentConfig(process.env).music)")
          export NAS_MUSIC_DIR
          docker compose -p reyunplex -f deploy/nas.compose.yml config --quiet

      - name: Build immutable image on the target Docker daemon
        run: |
          if ! docker image inspect "$REYUNPLEX_IMAGE" >/dev/null 2>&1; then
            docker build \
              --build-arg "REYUNPLEX_REVISION=$REYUNPLEX_REVISION" \
              --label "org.opencontainers.image.revision=$REYUNPLEX_REVISION" \
              -t "$REYUNPLEX_IMAGE" .
          fi
          bytes=$(docker image inspect --format '{{.Size}}' "$REYUNPLEX_IMAGE")
          echo "Image size: $bytes bytes (limit: 256 MiB)"
          test "$bytes" -le 268435456

      - name: Verify container using disposable volumes
        run: NASUID="$NAS_UID:$NAS_GID" sh tests/acceptance/docker-smoke.sh "$REYUNPLEX_IMAGE"

      - name: Back up stopped data, deploy and wait for readiness
        run: node scripts/deploy/start-deployment.mjs
