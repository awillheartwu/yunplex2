name: Publish accepted YunPlex image to GHCR

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '正式发布填写 v2.0.9；测试填写 test-<NAS 已验收的完整 SHA>'
        required: true
        type: string
      update_latest:
        description: '将 latest 更新到本次正式版本；补发历史版本时关闭'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Same NAS Docker daemon as ci.yml. Never build or deploy in this workflow.
jobs:
  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/dev' && startsWith(inputs.tag, 'test-'))))
    runs-on: [self-hosted, linux, docker]
    container:
      image: node:24-trixie
    timeout-minutes: 30
    env:
      DOCKER_API_VERSION: '1.43'
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GHCR_UPDATE_LATEST: ${{ github.event_name == 'push' && 'true' || inputs.update_latest }}
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
      NAS_APP_ROOT: ${{ vars.NAS_APP_ROOT }}
    steps:
      - name: Check out publication tools
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'test-') && github.ref_name || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse Docker CLI from NAS image
        run: sh scripts/ci/install-docker.sh

      - name: Publish the accepted local image without rebuilding
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: node scripts/release/publish.mjs

      - name: Verify the pulled test image using disposable volumes
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'test-')
        env:
          NASUID: ${{ vars.NAS_UID }}:${{ vars.NAS_GID }}
        run: sh tests/acceptance/docker-smoke.sh "reyunplex:${RELEASE_TAG#test-}"
