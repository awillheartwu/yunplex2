<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reYunPlex</title>
  <style>
    body { margin: 0; background: #0d0d0d; color: #ededed; font-family: Inter, system-ui, sans-serif; }
    .loader { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .spinner { width: 24px; height: 24px; border: 2px solid #2a2a2a; border-top-color: #5e6ad2; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"><div class="spinner"></div></div>
</body>
</html>
